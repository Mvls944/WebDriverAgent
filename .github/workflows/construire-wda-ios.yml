name: Construire WDA iPhone (non signe)

# ─────────────────────────────────────────────────────────────────────────────
# Fichier à déposer TEL QUEL dans ton fork de appium/WebDriverAgent, sous :
#   .github/workflows/construire-wda-ios.yml
#
# Ce qu'il fait : compile le WebDriverAgentRunner officiel pour un iPhone RÉEL,
# SANS SIGNATURE (CODE_SIGNING_ALLOWED=NO), et publie un artifact zip à récupérer.
#
# Ce qu'il ne fait jamais :
#   - il ne signe rien : aucune clé, aucun certificat, aucun .mobileprovision,
#     aucun secret, aucun jeton ;
#   - il ne pousse rien, ne publie rien, n'envoie rien sur ton projet local ;
#   - il ne télécharge aucun WDA « pré-signé » trouvé sur Internet.
#
# La commande de build n'est pas inventée : c'est Scripts/ci/build-real.sh du
# dépôt amont, avec les mêmes variables d'environnement que son propre workflow
# wda-package.yml (lu le 2026-10-10, commit v16.14.2).
#
# Le dépôt peut être privé (ton choix par défaut dans la mission) ou public.
# Dans les deux cas le contenu est du code amont sous licence BSD — jamais un
# fichier de ton projet.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      etiquette:
        description: "Étiquette amont à construire"
        required: true
        default: "v16.14.2"
        type: string
      commit_attendu:
        description: "Commit SHA exact que cette étiquette doit désigner"
        required: true
        default: "d15c0b2dbaa850fa712fba817e51cf8d5026d9f2"
        type: string

# Lectures seules : ce workflow n'a aucune écriture à demander.
permissions:
  contents: read

concurrency:
  group: construire-wda-iphone
  cancel-in-progress: false

jobs:
  iphone_reel:
    name: WebDriverAgentRunner pour iPhone réel
    runs-on: macos-15
    # Garde-fou budget : au-delà, le job est tué et aucune minute de plus n'est
    # consommée. Une compilation WDA réelle reste largement sous cette barre.
    timeout-minutes: 30

    env:
      PKG_NAME: WebDriverAgentRunner-Runner
      ZIP_PKG_NAME: WebDriverAgentRunner-Runner.zip

    steps:
      - name: Checkout de l'étiquette demandée
        uses: actions/checkout@v4
        with:
          repository: appium/WebDriverAgent
        ref: ${{ inputs.etiquette }}
          persist-credentials: false

      - name: Prouver l'origine du code AVANT de compiler
        run: |
          set -eu
          head_sha="$(git rev-parse HEAD)"
          echo "Commit construit : ${head_sha}"
          echo "Étiquette       : ${{ inputs.etiquette }}"
          echo "Licence         : $(head -n 1 LICENSE)"
          if [ "${head_sha}" != "${{ inputs.commit_attendu }}" ]; then
            echo "::error::Arrêt : le commit construit (${head_sha}) n'est pas celui vérifié sur ce poste (${{ inputs.commit_attendu }}). Rien ne sera compilé."
            exit 1
          fi

      - name: Xcode (version verrouillée par le dépôt amont)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Compilation par le script officiel du dépôt, sans signature
        run: sh "$GITHUB_WORKSPACE/Scripts/ci/build-real.sh"
        env:
          DERIVED_DATA_PATH: appium_wda_ios
          SCHEME: WebDriverAgentRunner
          DESTINATION: generic/platform=iOS
          WD: appium_wda_ios/Build/Products/Debug-iphoneos
          ZIP_PKG_NAME: ${{ env.ZIP_PKG_NAME }}

      - name: Sceller l'artefact (SHA-256) et prouver qu'il n'est pas signé
        run: |
          set -eu
          test -f "${ZIP_PKG_NAME}"
          shasum -a 256 "${ZIP_PKG_NAME}" > SHA256SUMS.txt

          if unzip -l "${ZIP_PKG_NAME}" | grep -q "embedded.mobileprovision"; then
            echo "::error::Refus : l'artefact contient un mobileprovision, ce n'est pas le paquet non signé attendu."
            exit 1
          fi
          if unzip -l "${ZIP_PKG_NAME}" | grep -q "_CodeSignature/"; then
            echo "::error::Refus : l'artefact est code-signé par quelqu'un d'autre."
            exit 1
          fi
          unzip -l "${ZIP_PKG_NAME}" | sed -n '1,15p'

          {
            echo ""
            echo "### Sceau de l'artefact"
            echo "- paquet : \`${ZIP_PKG_NAME}\`"
            echo "- commit : \`$(git rev-parse HEAD)\`"
            echo "- étiquette : \`${{ inputs.etiquette }}\`"
            echo "- sha256 : \`$(cut -d' ' -f1 SHA256SUMS.txt)\`"
            echo "- signature : **aucune** (CODE_SIGNING_ALLOWED=NO + vérification ci-dessus)"
            echo "- image : \`${ImageOS:-inconnue}\`, Xcode 16.4"
            echo "- taille : \`$(wc -c < "${ZIP_PKG_NAME}")\` octets"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rendre l'artefact récupérable depuis Windows
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}-iOS-non-signe
          path: |
            ${{ env.ZIP_PKG_NAME }}
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
